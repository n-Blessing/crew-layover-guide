# The live site is the gh-pages branch: dist/ at the branch root, plus .nojekyll,
# pushed by hand. This workflow could not run because the GitHub account had
# Actions locked over a billing issue, so it is not what published the current site.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SANITY_PROJECT_ID: p4yybrla
      PUBLIC_SANITY_DATASET: production
      SANITY_STUDIO_PROJECT_ID: p4yybrla
      SANITY_STUDIO_DATASET: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
